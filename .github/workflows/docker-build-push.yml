name: Build and Push Multi-Platform Docker Image

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag (e.g. manual or v1.0.0)'
        required: true
        default: 'manual'
      include_latest:
        description: 'Also tag as latest'
        required: false
        default: false
        type: boolean

# Least privilege: images are pushed to Docker Hub with secrets, not GHCR,
# so the GITHUB_TOKEN only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Init DB (smoke check)
        run: npm run init-db

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.6.1

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Determine Docker tags
        id: docker_tags
        # User-controlled values are passed via env (never interpolated into
        # the script) to prevent shell injection.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          TAG: ${{ github.event.inputs.tag }}
          INCLUDE_LATEST: ${{ github.event.inputs.include_latest }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${DOCKERHUB_USERNAME}/birdcam"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Docker tag grammar; also blocks newlines that could inject extra outputs
            if ! [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,119}$ ]]; then
              echo "::error::Invalid Docker tag: must match [A-Za-z0-9_][A-Za-z0-9_.-]{0,119}"
              exit 1
            fi
            if [ "$INCLUDE_LATEST" = "true" ]; then
              echo "tags=${IMAGE}:latest,${IMAGE}:${TAG},${IMAGE}:${TAG}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            else
              echo "tags=${IMAGE}:${TAG},${IMAGE}:${TAG}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$REF_NAME" = "dev" ]; then
            echo "tags=${IMAGE}:dev,${IMAGE}:dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            # Push to main
            echo "tags=${IMAGE}:latest,${IMAGE}:main,${IMAGE}:main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push multi-platform Docker image
        uses: docker/build-push-action@v6.7.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.ref_name == 'main' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to production on the self-hosted runner (the prod host) after every
  # successful push to main. The prod host's own compose setup is used as-is
  # (volumes, env, ports), so it must reference the Docker Hub image
  # <user>/birdcam:latest (or :main).
  #
  # Repository variables (Settings → Secrets and variables → Actions → Variables):
  #   DEPLOY_DIR    (required) directory on the prod host with its compose file
  #   DEPLOY_URL    (optional) base URL to verify, default http://localhost:3000
  #   DEPLOY_SERVICE (optional) compose service name, default birdcam
  deploy:
    runs-on: self-hosted
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Never run two deploys at once; a newer push waits for the running one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    timeout-minutes: 15

    steps:
      - name: Pull and restart
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          SERVICE: ${{ vars.DEPLOY_SERVICE || 'birdcam' }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_DIR" ] || [ ! -d "$DEPLOY_DIR" ]; then
            echo "::error::Repository variable DEPLOY_DIR must point to the prod compose directory on the runner host (got '${DEPLOY_DIR}')"
            exit 1
          fi
          cd "$DEPLOY_DIR"
          docker compose pull "$SERVICE"
          docker compose up -d "$SERVICE"
          docker image prune -f

      - name: Verify running version
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL || 'http://localhost:3000' }}
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA::7}"
          for i in $(seq 1 30); do
            running="$(curl -fsS "$DEPLOY_URL/api/build-info" 2>/dev/null | sed -n 's/.*"gitCommit":"\([0-9a-f]*\)".*/\1/p' || true)"
            if [ "$running" = "$expected" ]; then
              echo "Production is running $running"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Expected $expected at $DEPLOY_URL/api/build-info, got '${running:-no response}'. Does the prod compose file use the :latest/:main image?"
          exit 1
