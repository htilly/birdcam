# Build and run directly from GitHub (no local clone needed).
# Usage: docker compose -f docker-compose.github.yml up -d

services:
  birdcam:
    build:
      context: https://github.com/htilly/birdcam.git
      dockerfile: Dockerfile
    container_name: birdcam
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Optional: create first admin on first run
      # - ADMIN_USER=admin
      # - ADMIN_PASSWORD=changeme
      # - SESSION_SECRET=your-random-secret
    volumes:
      - birdcam-data:/app/data
    # HLS segments are ephemeral and rewritten every few seconds; keep them in
    # RAM instead of the container's writable layer. 256m is ample for several
    # cameras (only the last few segments per camera are kept).
    tmpfs:
      - /app/hls:size=256m
    restart: unless-stopped

volumes:
  birdcam-data:
