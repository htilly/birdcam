services:
  birdcam:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Start the Python motion detector (spawned by Node in this same container).
      - ENABLE_MOTION_DETECTOR=true
      # Optional: create first admin on first run
      # - ADMIN_USER=admin
      # - ADMIN_PASSWORD=changeme
      # SESSION_SECRET is auto-generated and persisted in the DB.
      # Only set this if you need a specific value or share sessions across instances.
      # - SESSION_SECRET=your-secret-here
    volumes:
      - birdcam-data:/app/data
    # HLS segments are ephemeral and rewritten every few seconds; keep them in
    # RAM instead of the container's writable layer. 256m is ample for several
    # cameras (only the last few segments per camera are kept).
    tmpfs:
      - /app/hls:size=256m
    restart: unless-stopped

volumes:
  birdcam-data:
